# ========== Profile & Screen ==========
# Performance profiles (LOW -> ULTRA). All values are legal slider values of
# the referenced options; profiles never touch preference-only settings.
profile.DEFAULT = 
# LOW: vanilla AO and no TAA by design (cheapest playable tier); the GTAO/SSAO
# params below stay low so switching AO_MODE back on keeps a sane budget.
profile.LOW = !SHADOW_PCSS shadowMapResolution=1024 CLOUD_TEMPORAL_UPSCALING=4 CLOUD_VIEW_MIN_STEPS=24 CLOUD_VIEW_MAX_STEPS=64 CLOUD_LIGHT_STEPS=3 AO_MODE=0 !TAA OPAQUE_SSR_QUALITY=0 EPIPOLAR_SLICES=256 EPIPOLAR_SAMPLES=128 EPIPOLAR_SHADOW_STEPS=16 WATER_EPIPOLAR_MAX_DISTANCE=6.0 !WATER_POM SHADOW_BLOCKER_SAMPLES=2 SHADOW_PCF_MIN_SAMPLES=2 SHADOW_PCF_MAX_SAMPLES=8 SHADOW_SSS_STEPS=4 !WATER_FOG_CAUSTICS !AIR_FOG_SHADOWS
profile.MEDIUM = shadowMapResolution=1536 CLOUD_TEMPORAL_UPSCALING=3 CLOUD_VIEW_MIN_STEPS=32 CLOUD_VIEW_MAX_STEPS=96 CLOUD_LIGHT_STEPS=6 AO_MODE=1 TAA OPAQUE_SSR_QUALITY=1 GTAO_SLICES=3 GTAO_HORIZON_STEPS=3 SSAO_SAMPLES=16 EPIPOLAR_SLICES=512 EPIPOLAR_SAMPLES=256 EPIPOLAR_SHADOW_STEPS=32 SHADOW_BLOCKER_SAMPLES=4 SHADOW_PCF_MIN_SAMPLES=4 SHADOW_PCF_MAX_SAMPLES=12 SHADOW_SSS_STEPS=6 WATER_FOG_CAUSTICS AIR_FOG_SHADOWS
profile.HIGH = shadowMapResolution=2048 CLOUD_TEMPORAL_UPSCALING=2 CLOUD_VIEW_MIN_STEPS=32 CLOUD_VIEW_MAX_STEPS=128 CLOUD_LIGHT_STEPS=8 AO_MODE=1 TAA OPAQUE_SSR_QUALITY=2 GTAO_SLICES=4 GTAO_HORIZON_STEPS=4 SSAO_SAMPLES=24 EPIPOLAR_SLICES=1024 EPIPOLAR_SAMPLES=512 EPIPOLAR_SHADOW_STEPS=64 SHADOW_BLOCKER_SAMPLES=4 SHADOW_PCF_MIN_SAMPLES=4 SHADOW_PCF_MAX_SAMPLES=16 SHADOW_SSS_STEPS=8 WATER_FOG_CAUSTICS AIR_FOG_SHADOWS
# ULTRA: full-res clouds and 3072 shadow are the headline; GTAO slices and the
# epipolar grid stay at the HIGH tier because 2048 slices and 6 GTAO slices
# measured ~1.4 ms and ~0.85 ms in benchmark runs.
profile.ULTRA = shadowMapResolution=3072 CLOUD_TEMPORAL_UPSCALING=1 CLOUD_VIEW_MIN_STEPS=40 CLOUD_VIEW_MAX_STEPS=192 CLOUD_LIGHT_STEPS=8 AO_MODE=1 TAA OPAQUE_SSR_QUALITY=3 GTAO_SLICES=4 GTAO_HORIZON_STEPS=6 SSAO_SAMPLES=32 EPIPOLAR_SLICES=1024 EPIPOLAR_SAMPLES=512 EPIPOLAR_SHADOW_STEPS=64 SHADOW_BLOCKER_SAMPLES=6 SHADOW_PCF_MIN_SAMPLES=4 SHADOW_PCF_MAX_SAMPLES=24 SHADOW_SSS_STEPS=12 WATER_FOG_CAUSTICS AIR_FOG_SHADOWS

