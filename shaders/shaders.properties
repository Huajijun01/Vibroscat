blend.gbuffers_basic.colortex12 = off
blend.gbuffers_beaconbeam.colortex12 = off
blend.gbuffers_block.colortex12 = off
blend.gbuffers_entities.colortex12 = off
blend.gbuffers_hand.colortex12 = off
blend.gbuffers_line.colortex12 = off
blend.gbuffers_particles.colortex12 = off
blend.gbuffers_spidereyes.colortex12 = off
blend.gbuffers_terrain.colortex12 = off
blend.gbuffers_terrain_cutout.colortex12 = off
blend.gbuffers_terrain_solid.colortex12 = off
blend.gbuffers_textured.colortex12 = off
blend.gbuffers_textured_lit.colortex12 = off

# -- Blend: translucent (colortex12 premultiplied-over, sources carry their
# alpha in-shader; colortex2 nearest-wins; composite1 integrates) --

