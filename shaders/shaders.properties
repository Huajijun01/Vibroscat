# ==========================================================================
# Vibroscat shaders.properties
#
# Iris scheduling, resources, and settings UI. Sections group directives by
# kind so that every program toggle, resource declaration, and custom uniform
# can be audited in one place. Reordering sections does not change values.
#
#   1. Profiles and settings screen
#   2. Iris features
#   3. Program scheduling
#   4. Geometry scheduling, culling, and depth
#   5. Render state
#   6. Resources
#   7. Custom uniforms and variables
# ==========================================================================

# ==========================================================================
# 1. Profiles and settings screen
# ==========================================================================

# Performance profiles (LOW -> ULTRA). All values are legal slider values of
# the referenced options; profiles never touch preference-only settings.
# Plant SSS ships off on LOW/MEDIUM and on for HIGH/ULTRA.
# LOW: no volumetric clouds (the cheap cirrus shell stays), no contact
# shadows, no plant SSS, vanilla AO and no TAA; the GTAO/SSAO params below
# stay low so switching AO_MODE back on keeps a sane budget.
profile.LOW = !SHADOW_PCSS shadowMapResolution=1024 !VOLUMETRIC_CLOUDS AO_MODE=0 !TAA !OPAQUE_REFLECTION !WATER_POM SHADOW_BLOCKER_SAMPLES=2 SHADOW_PCF_MIN_SAMPLES=2 SHADOW_PCF_MAX_SAMPLES=8 !SHADOW_SSS RSM_SAMPLES=8 !CONTACT_SHADOW EPIPOLAR_SLICES=256 EPIPOLAR_SAMPLES=128 AIR_EPIPOLAR_SHADOW_STEPS=8
profile.MEDIUM = shadowMapResolution=1536 CLOUD_TEMPORAL_UPSCALING=3 CLOUD_VIEW_MIN_STEPS=32 CLOUD_VIEW_MAX_STEPS=96 CLOUD_LIGHT_STEPS=6 AO_MODE=1 TAA !OPAQUE_REFLECTION GTAO_SLICES=3 GTAO_HORIZON_STEPS=3 SSAO_SAMPLES=16 SHADOW_BLOCKER_SAMPLES=4 SHADOW_PCF_MIN_SAMPLES=4 SHADOW_PCF_MAX_SAMPLES=12 !SHADOW_SSS SHADOW_SSS_STEPS=6 RSM_SAMPLES=16 CONTACT_SHADOW_STEPS=8 CONTACT_SHADOW_MAX_DISTANCE=10.0 EPIPOLAR_SLICES=512 EPIPOLAR_SAMPLES=256 AIR_EPIPOLAR_SHADOW_STEPS=24
profile.HIGH = shadowMapResolution=2048 CLOUD_TEMPORAL_UPSCALING=2 CLOUD_VIEW_MIN_STEPS=32 CLOUD_VIEW_MAX_STEPS=128 CLOUD_LIGHT_STEPS=8 AO_MODE=1 TAA OPAQUE_REFLECTION OPAQUE_SSR_STEPS=8 GTAO_SLICES=4 GTAO_HORIZON_STEPS=4 SSAO_SAMPLES=24 SHADOW_BLOCKER_SAMPLES=4 SHADOW_PCF_MIN_SAMPLES=4 SHADOW_PCF_MAX_SAMPLES=16 SHADOW_SSS SHADOW_SSS_STEPS=8 RSM_SAMPLES=32 CONTACT_SHADOW_STEPS=12 CONTACT_SHADOW_MAX_DISTANCE=12.0 EPIPOLAR_SLICES=1024 EPIPOLAR_SAMPLES=512 AIR_EPIPOLAR_SHADOW_STEPS=32
# ULTRA: full-res clouds, 3072 shadow and higher AO/shadow sample budgets.
profile.ULTRA = shadowMapResolution=3072 CLOUD_TEMPORAL_UPSCALING=1 CLOUD_VIEW_MIN_STEPS=40 CLOUD_VIEW_MAX_STEPS=192 CLOUD_LIGHT_STEPS=8 AO_MODE=1 TAA OPAQUE_REFLECTION OPAQUE_SSR_STEPS=8 GTAO_SLICES=4 GTAO_HORIZON_STEPS=6 SSAO_SAMPLES=32 SHADOW_BLOCKER_SAMPLES=6 SHADOW_PCF_MIN_SAMPLES=4 SHADOW_PCF_MAX_SAMPLES=24 SHADOW_SSS SHADOW_SSS_STEPS=12 RSM_SAMPLES=64 CONTACT_SHADOW_STEPS=16 CONTACT_SHADOW_MAX_DISTANCE=16.0 EPIPOLAR_SLICES=1024 EPIPOLAR_SAMPLES=512 AIR_EPIPOLAR_SHADOW_STEPS=48

