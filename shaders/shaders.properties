# ==========================================================================
# 2. Iris features
# ==========================================================================

iris.features.required = COMPUTE_SHADERS CUSTOM_IMAGES SSBO

# ==========================================================================
# 3. Program scheduling
# ==========================================================================

# allowConcurrentCompute drops the per-dispatch memory barrier between the
# computes of one numbered pass; the host still barriers once after the last
# compute of the pass (before any fragment stage). The only multi-compute
# group in this pack is deferred1: clouds then AO. They write colortex12 alt
# and the separate AO custom image, respectively, with disjoint write sets.
# They read only depth, material, history, and noise resources that no compute in
# the group writes; deferred1.fsh merges both after the group-end barrier.
# Every other compute pass runs alone in its group. Any future same-group
# compute pair must keep this write disjointness and out-of-group input rule,
# and letter entries must stay contiguous so the group stays loadable.
allowConcurrentCompute = true

# program.<world>/<pass>.enabled gates one pass. Passes are listed in schedule
# order with the three dimensions together; world-1 is the Nether, world0 the
# Overworld, and world1 the End.

#if SSR_QUARTER_DEPTH && (WATER_SSR || OPAQUE_REFLECTION)
program.world0/deferred.enabled = true
program.world1/deferred.enabled = true
program.world-1/deferred.enabled = true
#else
program.world0/deferred.enabled = false
program.world1/deferred.enabled = false
program.world-1/deferred.enabled = false
#endif

program.world0/composite2.enabled = true
program.world1/composite2.enabled = false
program.world-1/composite2.enabled = false

program.world0/composite3.enabled = DOF
program.world1/composite3.enabled = DOF
program.world-1/composite3.enabled = DOF

#if TAA && TAA_DEBUG > 0
program.world0/composite5.enabled = false
program.world1/composite5.enabled = false
program.world-1/composite5.enabled = false
#else
program.world0/composite5.enabled = MOTION_BLUR
program.world1/composite5.enabled = MOTION_BLUR
program.world-1/composite5.enabled = MOTION_BLUR
#endif

# The exposure and bloom chains interleave two independent compute pairs.
# composite6: AE sweep (SSBO0) || bloom extract (colortex12 mip 1);
# composite7: AE reduction (SSBO0) || bloom down mip 1 -> 2 (colortex12).
# Write sets stay disjoint inside a group, the sweep and the reduction never
# share one group, and no group holds two adjacent bloom layers. Both letter
# entries of a group share AE || BLOOM because the host stops merging letter
# entries at the first disabled entry; each kernel keeps its own feature
# switch and no-ops when its feature is off. Slots 8 and 9 are empty; the
# scene read must stay after motion blur, so nothing here may run earlier.
program.world0/composite6.enabled = AE || BLOOM
program.world1/composite6.enabled = AE || BLOOM
program.world-1/composite6.enabled = AE || BLOOM

program.world0/composite7.enabled = AE || BLOOM
program.world1/composite7.enabled = AE || BLOOM
program.world-1/composite7.enabled = AE || BLOOM

program.world0/composite10.enabled = BLOOM
program.world1/composite10.enabled = BLOOM
program.world-1/composite10.enabled = BLOOM

program.world0/composite11.enabled = BLOOM
program.world1/composite11.enabled = BLOOM
program.world-1/composite11.enabled = BLOOM

program.world0/composite12.enabled = BLOOM
program.world1/composite12.enabled = BLOOM
program.world-1/composite12.enabled = BLOOM

program.world0/composite13.enabled = BLOOM
program.world1/composite13.enabled = BLOOM
program.world-1/composite13.enabled = BLOOM

program.world0/composite14.enabled = BLOOM
program.world1/composite14.enabled = BLOOM
program.world-1/composite14.enabled = BLOOM

program.world0/composite15.enabled = BLOOM
program.world1/composite15.enabled = BLOOM
program.world-1/composite15.enabled = BLOOM

program.world0/composite16.enabled = BLOOM
program.world1/composite16.enabled = BLOOM
program.world-1/composite16.enabled = BLOOM

program.world0/composite17.enabled = BLOOM
program.world1/composite17.enabled = BLOOM
program.world-1/composite17.enabled = BLOOM

program.world0/composite18.enabled = BLOOM
program.world1/composite18.enabled = BLOOM
program.world-1/composite18.enabled = BLOOM

program.world0/composite19.enabled = BLOOM
program.world1/composite19.enabled = BLOOM
program.world-1/composite19.enabled = BLOOM

program.world0/composite20.enabled = BLOOM
program.world1/composite20.enabled = BLOOM
program.world-1/composite20.enabled = BLOOM

# The deferred1 program holds cloud generation and AO generation/accumulation
# computes plus full-res cloud accumulation and guided AO reconstruction.
# The fragment publishes merged colortex8 history: clouds on sky, AO on
# geometry. Iris flips the output for the following lighting consumers.
# -- deferred1_a: half-res AO, same pass as the clouds --

#if AO_MODE != 0 && GI_MODE == 0
program.world0/deferred1.enabled = true
program.world1/deferred1.enabled = true
program.world-1/deferred1.enabled = true
program.world0/deferred1_a.enabled = true
program.world1/deferred1_a.enabled = true
program.world-1/deferred1_a.enabled = true
#else
program.world0/deferred1.enabled = VOLUMETRIC_CLOUDS
program.world1/deferred1.enabled = VOLUMETRIC_CLOUDS
program.world-1/deferred1.enabled = VOLUMETRIC_CLOUDS
program.world0/deferred1_a.enabled = false
program.world1/deferred1_a.enabled = false
program.world-1/deferred1_a.enabled = false
#endif

#ifdef OPAQUE_REFLECTION
program.world0/deferred2.enabled = true
program.world1/deferred2.enabled = true
program.world-1/deferred2.enabled = true
#else
program.world0/deferred2.enabled = false
program.world1/deferred2.enabled = false
program.world-1/deferred2.enabled = false
#endif

# GI fragment pass between opaque SSR and deferred shading.
# Numeric options belong in preprocessor conditions, not boolean expressions.
# GI irradiance and its actual receiver history share one half-size MRT.
size.buffer.colortex9 = 0.5 0.5
size.buffer.colortex10 = 0.5 0.5
#if GI_MODE != 0
program.world0/deferred3.enabled = true
program.world1/deferred3.enabled = true
program.world-1/deferred3.enabled = true
#else
program.world0/deferred3.enabled = false
program.world1/deferred3.enabled = false
program.world-1/deferred3.enabled = false
#endif

# ==========================================================================
# 4. Geometry scheduling, culling, and depth
# ==========================================================================

frustum.culling = true
occlusion.culling = true
#if GI_MODE == 2
# RSM emitters can affect the screen without casting a direct shadow into it.
shadow.culling = false
shadowBlockEntities = true
#else
shadow.culling = true
shadowBlockEntities = false
#endif

# -- Particles --
# Opaque quad particles are shaded by the deferred pass and therefore need a
# complete opaque GBuffer, so they must be submitted before deferred. Iris
# 1.11.4 on MC 26.2 ignores particles.ordering for the quad-particle path and
# already splits opaque (gbuffers_particles, before deferred) from translucent
# (gbuffers_particles_translucent, after translucent terrain); "mixed" selects
# the same split on hosts that still honor the directive. "after" would delay
# the opaque group past the very pass that reads its GBuffer.

particles.ordering = mixed

# -- Depth writes --

beacon.beam.depth = true
rain.depth = false

