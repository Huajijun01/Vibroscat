# Class-based materialID mapping
# Low byte of mc_Entity.x is the material ID. Upper byte is the plant motion
# class (1 rooted, 2 tall lower, 3 tall upper, 4 leaves); terrain strips it
# before writing material data. Static blocks retain their original IDs.

# Water (materialID 80-95)
block.80 = water

# Emissive (materialID 112-127)
block.112 = glowstone sea_lantern lantern redstone_lamp jack_o_lantern shroomlight
block.113 = torch wall_torch
block.114 = fire soul_fire magma_block
block.115 = lava
block.116 = beacon end_rod
block.117 = brewing_stand enchanting_table
block.118 = soul_torch soul_wall_torch soul_lantern soul_campfire
block.119 = campfire furnace smoker blast_furnace
block.120 = candle
block.121 = amethyst_block budding_amethyst
block.122 = sculk sculk_catalyst sculk_shrieker sculk_sensor

# Metal (materialID 96-111)
block.96 = iron_block gold_block diamond_block emerald_block netherite_block copper_block
block.97 = anvil chipped_anvil damaged_anvil
block.98 = obsidian crying_obsidian

