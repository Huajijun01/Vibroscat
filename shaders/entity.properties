# Class-based entity materialID mapping.
# solid.vertex encodes `entityId - 10000` into the G-buffer materialID slot,
# so the IDs here start at 10000 and reuse the block.properties classes
# (see the materialID ranges at the top of block.properties).

# Metal (materialID 96, see block.96)
entity.10096 = minecraft:iron_golem

# Emissive/fire (materialID 114, see block.114): the >= 112 material class is
# excluded from rain wetness, which fits permanently burning mobs.
entity.10114 = minecraft:blaze minecraft:magma_cube
