block.386 = wheat carrots potatoes beetroots bamboo_sapling sweet_berry_bush melon_stem pumpkin_stem attached_melon_stem attached_pumpkin_stem torchflower_crop
block.387 = dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip oxeye_daisy cornflower lily_of_the_valley wither_rose torchflower cactus_flower
block.389 = azalea flowering_azalea bush firefly_bush oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling mangrove_propagule:hanging=false cherry_sapling pale_oak_sapling
block.390 = dead_bush

# Upper/lower halves share a two-meter beam, wind sample and seam displacement.
block.640 = tall_grass:half=lower large_fern:half=lower
block.896 = tall_grass:half=upper large_fern:half=upper
block.642 = pitcher_crop:half=lower
block.898 = pitcher_crop:half=upper
block.643 = rose_bush:half=lower sunflower:half=lower lilac:half=lower peony:half=lower pitcher_plant:half=lower
block.899 = rose_bush:half=upper sunflower:half=upper lilac:half=upper peony:half=upper pitcher_plant:half=upper

# Full cubes use a continuous world-vertex field, including shared corners.
block.1153 = oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves azalea_leaves flowering_azalea_leaves cherry_leaves pale_oak_leaves

