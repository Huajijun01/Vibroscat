# -- Wetness --

uniform.float.u_fast_wetness = smooth(0, rainStrength, 10)
# Smooth camera-biome rain eligibility independently of storm strength.
uniform.float.u_rain_biome = smooth(62, if(biome_precipitation == 1, 1.0, 0.0), 10, 10)
# Smooth camera-biome snow eligibility independently of storm strength.
uniform.float.u_snow_biome = smooth(63, if(biome_precipitation == 2, 1.0, 0.0), 10, 10)

# -- Rain ripple time reconstruction (one filtered volume lookup) --
# 64 slices / 4 authored seconds at the existing 2x playback speed: 32 slices/s.
# Fit to the shipped wave field's subframe slopes (2026-10-19). The symmetric
# weights a(t), b(t)=a(1-t) avoid linear blending's strong midpoint attenuation.
# CPU variables keep the polynomial and phase work out of both surface shaders.
# Refit these coefficients if the rain ripple bake changes.
#if RAIN_WETNESS && RAIN_RIPPLES
variable.float.rain_ripple_frame = fmod(frameTimeCounter * 32.0, 64.0)
variable.float.rain_ripple_phase = frac(rain_ripple_frame)
variable.float.rain_ripple_phase_reverse = 1.0 - rain_ripple_phase
variable.float.rain_ripple_weight_left = rain_ripple_phase_reverse * (1.0 + rain_ripple_phase * (1.2834266893 + rain_ripple_phase * (-0.1925373125 + rain_ripple_phase * (-0.5585295229 + rain_ripple_phase * 0.1602648895))))
variable.float.rain_ripple_weight_right = rain_ripple_phase * (1.0 + rain_ripple_phase_reverse * (1.2834266893 + rain_ripple_phase_reverse * (-0.1925373125 + rain_ripple_phase_reverse * (-0.5585295229 + rain_ripple_phase_reverse * 0.1602648895))))
uniform.float.u_rain_ripple_gain = rain_ripple_weight_left + rain_ripple_weight_right
# Shift the query within the same two slices, then align to their texel centers.
uniform.float.u_rain_ripple_time_uv = (floor(rain_ripple_frame) + rain_ripple_weight_right / u_rain_ripple_gain + 0.5) / 64.0
#endif

# -- Scene render rectangle (display-sized backing textures) --
#if TAA && TAAU
variable.float.sceneScale = TAAU_RENDER_SCALE
#else
variable.float.sceneScale = 1.0
#endif
variable.float.sceneWidth = max(floor(viewWidth * sceneScale), 1.0)
variable.float.sceneHeight = max(floor(viewHeight * sceneScale), 1.0)
uniform.vec2.u_render_res = vec2(sceneWidth, sceneHeight)
uniform.vec2.u_render_pixel_size = vec2(1.0 / sceneWidth, 1.0 / sceneHeight)
uniform.vec2.u_render_scale = vec2(sceneWidth / viewWidth, sceneHeight / viewHeight)

# -- TAA jitter (TAA_JITTER selects a centered scene-pixel sequence consumed
#    at 0.5 scale: 0 = fixed 8-frame Halton(2,3), 1 = continuous R2) --
#    R2 uses 0.7548776662 = 1/1.3247179572 and 0.5698402910 =
#    1/1.7548776662, the same phase as the cloud-grid u_r2_offset.
#    The fixed sequence is a lookup table, and Iris reads a chain as
#    (cond, value) pairs plus one trailing else value. Without that else the
#    call is one argument short, no if() overload matches, and every uniform
#    built from these variables fails to resolve.
#if TAA_JITTER == 0
variable.float.taaJitterFrame = fmod(frameCounter, 8)
variable.float.taaJitterFramePrevious = fmod(frameCounter - 1, 8)
variable.float.frameX = if(taaJitterFrame == 0, 0.0, taaJitterFrame == 1, -0.5, taaJitterFrame == 2, 0.5, taaJitterFrame == 3, -0.75, taaJitterFrame == 4, 0.25, taaJitterFrame == 5, -0.25, taaJitterFrame == 6, 0.75, taaJitterFrame == 7, -0.875, 0.0)
variable.float.frameY = if(taaJitterFrame == 0, -0.33333, taaJitterFrame == 1, 0.33333, taaJitterFrame == 2, -0.77778, taaJitterFrame == 3, -0.11111, taaJitterFrame == 4, 0.55556, taaJitterFrame == 5, -0.55556, taaJitterFrame == 6, 0.11111, taaJitterFrame == 7, 0.77778, 0.0)
variable.float.previousFrameX = if(taaJitterFramePrevious == 0, 0.0, taaJitterFramePrevious == 1, -0.5, taaJitterFramePrevious == 2, 0.5, taaJitterFramePrevious == 3, -0.75, taaJitterFramePrevious == 4, 0.25, taaJitterFramePrevious == 5, -0.25, taaJitterFramePrevious == 6, 0.75, taaJitterFramePrevious == 7, -0.875, 0.0)
variable.float.previousFrameY = if(taaJitterFramePrevious == 0, -0.33333, taaJitterFramePrevious == 1, 0.33333, taaJitterFramePrevious == 2, -0.77778, taaJitterFramePrevious == 3, -0.11111, taaJitterFramePrevious == 4, 0.55556, taaJitterFramePrevious == 5, -0.55556, taaJitterFramePrevious == 6, 0.11111, taaJitterFramePrevious == 7, 0.77778, 0.0)
#else
variable.float.frameX = frac(frameCounter * 0.7548776662 + 0.5) * 2.0 - 1.0
variable.float.frameY = frac(frameCounter * 0.5698402910 + 0.5) * 2.0 - 1.0
variable.float.previousFrameX = frac((frameCounter - 1) * 0.7548776662 + 0.5) * 2.0 - 1.0
variable.float.previousFrameY = frac((frameCounter - 1) * 0.5698402910 + 0.5) * 2.0 - 1.0
#endif
uniform.vec2.u_taa_offset = vec2(frameX / sceneWidth, frameY / sceneHeight)
uniform.vec2.u_taa_offset_previous = vec2(previousFrameX / sceneWidth, previousFrameY / sceneHeight)

# -- Screen --
uniform.vec2.u_screen_res = vec2(viewWidth, viewHeight)
uniform.vec2.u_view_pixel_size = vec2(1.0 / viewWidth, 1.0 / viewHeight)

# -- World-space sun direction (computed from view-space sunPosition via gbufferModelViewInverse) --
variable.float.view_sun_norm = 1.0 / sqrt(sunPosition.x * sunPosition.x + sunPosition.y * sunPosition.y + sunPosition.z * sunPosition.z)
variable.float.view_sun_x = sunPosition.x * view_sun_norm
variable.float.view_sun_y = sunPosition.y * view_sun_norm
variable.float.view_sun_z = sunPosition.z * view_sun_norm
variable.float.sun_x = gbufferModelViewInverse.0.0 * view_sun_x + gbufferModelViewInverse.1.0 * view_sun_y + gbufferModelViewInverse.2.0 * view_sun_z
variable.float.sun_y = gbufferModelViewInverse.0.1 * view_sun_x + gbufferModelViewInverse.1.1 * view_sun_y + gbufferModelViewInverse.2.1 * view_sun_z
variable.float.sun_z = gbufferModelViewInverse.0.2 * view_sun_x + gbufferModelViewInverse.1.2 * view_sun_y + gbufferModelViewInverse.2.2 * view_sun_z
uniform.vec3.u_world_sun_dir = vec3(sun_x, sun_y, sun_z)

# -- World-space moon direction --
variable.float.view_moon_norm = 1.0 / sqrt(moonPosition.x * moonPosition.x + moonPosition.y * moonPosition.y + moonPosition.z * moonPosition.z)
variable.float.view_moon_x = moonPosition.x * view_moon_norm
variable.float.view_moon_y = moonPosition.y * view_moon_norm
variable.float.view_moon_z = moonPosition.z * view_moon_norm
variable.float.moon_x = gbufferModelViewInverse.0.0 * view_moon_x + gbufferModelViewInverse.1.0 * view_moon_y + gbufferModelViewInverse.2.0 * view_moon_z
variable.float.moon_y = gbufferModelViewInverse.0.1 * view_moon_x + gbufferModelViewInverse.1.1 * view_moon_y + gbufferModelViewInverse.2.1 * view_moon_z
variable.float.moon_z = gbufferModelViewInverse.0.2 * view_moon_x + gbufferModelViewInverse.1.2 * view_moon_y + gbufferModelViewInverse.2.2 * view_moon_z

# -- World-space light direction (sun or moon based on sunAngle) --
variable.float.light_x = if(sunAngle < 0.5, sun_x, moon_x)
variable.float.light_y = if(sunAngle < 0.5, sun_y, moon_y)
variable.float.light_z = if(sunAngle < 0.5, sun_z, moon_z)
uniform.vec3.u_world_light_dir = vec3(light_x, light_y, light_z)

uniform.float.u_cam_altitude = 0.2 + cameraPosition.y * 0.001

# -- Frame-constant derives (evaluated once per program change) --
# Camera translation delta shared by TAA, GI, AO, clouds and the volume.
uniform.vec3.u_camera_delta = cameraPosition - previousCameraPosition
variable.float.camera_delta_sq = u_camera_delta.x * u_camera_delta.x + u_camera_delta.y * u_camera_delta.y + u_camera_delta.z * u_camera_delta.z
uniform.float.u_camera_delta_sq = camera_delta_sq

# Eye position in camera-relative scene space: the model-view-inverse
# translation column (rows 0..2, column 3).
variable.float.eye_scene_x = gbufferModelViewInverse.3.0
variable.float.eye_scene_y = gbufferModelViewInverse.3.1
variable.float.eye_scene_z = gbufferModelViewInverse.3.2
uniform.vec3.u_eye_scene_pos = vec3(eye_scene_x, eye_scene_y, eye_scene_z)

# Projection inverse depth-row sum (screen depth 1) and the SSR/AO decode
# scale derived from it.
uniform.float.u_inv_clip_depth = gbufferProjectionInverse.2.3 + gbufferProjectionInverse.3.3
uniform.float.u_ssr_depth_decode = 0.0039072041399776936 / u_inv_clip_depth
uniform.float.u_clip_far_distance = 1.0 / u_inv_clip_depth

# -- Atmosphere camera (planet-centred km) --
uniform.float.u_camera_radius_km = 6360.0 + u_cam_altitude
variable.float.camera_radius_sq = u_camera_radius_km * u_camera_radius_km
uniform.float.u_camera_radius_sq = camera_radius_sq
uniform.vec3.u_atmosphere_camera_pos = vec3(0.0, u_camera_radius_km, 0.0)
uniform.float.u_sky_lut_horizon_theta = asin(6360.0 / u_camera_radius_km) - pi * 0.5
variable.float.sky_lut_sun_y = u_world_sun_dir.y
uniform.vec3.u_sky_lut_sun_dir = vec3(0.0, sky_lut_sun_y, sqrt(1.0 - sky_lut_sun_y * sky_lut_sun_y))
uniform.float.u_cam_sun_dot = u_camera_radius_km * u_world_sun_dir.y

# -- Cloud / grid time derives --
uniform.vec2.u_cloud_world_km_offset = vec2(cameraPosition.x * 0.001, cameraPosition.z * 0.001)
variable.float.r2_offset_x = frac(0.5 + frameCounter * 0.7548776662)
variable.float.r2_offset_y = frac(0.5 + frameCounter * 0.5698402910)
uniform.vec2.u_r2_offset = vec2(r2_offset_x, r2_offset_y)

# -- Water fog: sky access, column depth, refraction path, transmittances --
variable.float.water_skylight_raw = eyeBrightnessSmooth.y / 240.0
uniform.float.u_water_skylight = clamp(water_skylight_raw, 0.0, 1.0)
uniform.float.u_water_column_depth = max((1.0 - u_water_skylight) * 15.0, 1.0)
variable.float.water_refract_sq = (1.0 / 1.333) * (1.0 / 1.333) * (1.0 - u_world_light_dir.y * u_world_light_dir.y)
uniform.float.u_water_light_path = 1.0 / max(sqrt(1.0 - water_refract_sq), 0.001)
variable.float.water_tau_r = 0.24 * u_water_column_depth
variable.float.water_tau_g = 0.114 * u_water_column_depth
variable.float.water_tau_b = 0.09 * u_water_column_depth
uniform.vec3.u_water_ambient_transmittance = vec3(exp(0.0 - water_tau_r), exp(0.0 - water_tau_g), exp(0.0 - water_tau_b))
variable.float.water_direct_r = water_tau_r * u_water_light_path
variable.float.water_direct_g = water_tau_g * u_water_light_path
variable.float.water_direct_b = water_tau_b * u_water_light_path
uniform.vec3.u_water_direct_transmittance = vec3(exp(0.0 - water_direct_r), exp(0.0 - water_direct_g), exp(0.0 - water_direct_b))
uniform.float.u_water_wetness_gain = 1.0 - wetness * 0.6
uniform.float.u_eye_sky_access = 0.15 * water_skylight_raw / (1.0 - 0.85 * water_skylight_raw)

# -- Light directions (model-view columns applied to the world vectors) --
variable.float.light_view_x = gbufferModelView.0.0 * u_world_light_dir.x + gbufferModelView.1.0 * u_world_light_dir.y + gbufferModelView.2.0 * u_world_light_dir.z
variable.float.light_view_y = gbufferModelView.0.1 * u_world_light_dir.x + gbufferModelView.1.1 * u_world_light_dir.y + gbufferModelView.2.1 * u_world_light_dir.z
variable.float.light_view_z = gbufferModelView.0.2 * u_world_light_dir.x + gbufferModelView.1.2 * u_world_light_dir.y + gbufferModelView.2.2 * u_world_light_dir.z
uniform.vec3.u_view_light_dir = vec3(light_view_x, light_view_y, light_view_z)
variable.float.sun_view_x = gbufferModelView.0.0 * u_world_sun_dir.x + gbufferModelView.1.0 * u_world_sun_dir.y + gbufferModelView.2.0 * u_world_sun_dir.z
variable.float.sun_view_y = gbufferModelView.0.1 * u_world_sun_dir.x + gbufferModelView.1.1 * u_world_sun_dir.y + gbufferModelView.2.1 * u_world_sun_dir.z
variable.float.sun_view_z = gbufferModelView.0.2 * u_world_sun_dir.x + gbufferModelView.1.2 * u_world_sun_dir.y + gbufferModelView.2.2 * u_world_sun_dir.z
uniform.vec3.u_sun_dir_view = vec3(sun_view_x, sun_view_y, sun_view_z)
variable.float.light_shadow_x = shadowModelView.0.0 * u_world_light_dir.x + shadowModelView.1.0 * u_world_light_dir.y + shadowModelView.2.0 * u_world_light_dir.z
variable.float.light_shadow_y = shadowModelView.0.1 * u_world_light_dir.x + shadowModelView.1.1 * u_world_light_dir.y + shadowModelView.2.1 * u_world_light_dir.z
variable.float.light_shadow_z = shadowModelView.0.2 * u_world_light_dir.x + shadowModelView.1.2 * u_world_light_dir.y + shadowModelView.2.2 * u_world_light_dir.z
uniform.vec3.u_shadow_light_dir = vec3(light_shadow_x, light_shadow_y, light_shadow_z)
uniform.vec3.u_world_moon_dir = vec3(0.0 - u_world_sun_dir.x, 0.0 - u_world_sun_dir.y, 0.0 - u_world_sun_dir.z)
uniform.float.u_light_disc_radius = if(u_world_light_dir.y > 0.0, 0.005, 0.00436)

# -- Star map night fade --
variable.float.star_fade_t = clamp((u_world_sun_dir.y + 0.05) * 5.0, 0.0, 1.0)
uniform.float.u_star_night_fade = 1.0 - star_fade_t * star_fade_t * (3.0 - 2.0 * star_fade_t)

# -- Weather, plants, caustics, sun slope --
uniform.float.u_wetness_weight = u_fast_wetness * u_rain_biome
uniform.float.u_rain_weight = rainStrength * u_rain_biome
uniform.float.u_rain_particle_opacity = mix(1.0, 0.4, u_rain_biome)
variable.float.plant_weather_gain_base = 1.0 + 0.65 * rainStrength
uniform.float.u_plant_weather_gain = plant_weather_gain_base
uniform.vec2.u_plant_wind_time = vec2(3.2 * frameTimeCounter, 2.4 * frameTimeCounter)
variable.float.caustic_phase = frac(frameTimeCounter * 0.25)
uniform.float.u_caustic_time = caustic_phase
uniform.float.u_caustic_source_time = caustic_phase + 0.5 / 64.0
uniform.vec2.u_caustic_advection = vec2(0.86140636021 * frameTimeCounter, 0.23905094417 * frameTimeCounter)
variable.float.sun_slope_x = u_world_sun_dir.x / max(u_world_sun_dir.y, 0.02)
variable.float.sun_slope_z = u_world_sun_dir.z / max(u_world_sun_dir.y, 0.02)
uniform.vec2.u_sun_slope = vec2(sun_slope_x, sun_slope_z)
variable.float.water_sun_height_t = clamp((u_world_sun_dir.y - 0.02) / 0.1, 0.0, 1.0)
uniform.float.u_water_sun_height = water_sun_height_t * water_sun_height_t * (3.0 - 2.0 * water_sun_height_t)
uniform.float.u_eye_height_m = cameraPositionInt.y + cameraPositionFract.y + gbufferModelViewInverse.3.1
variable.float.airfog_day_t = clamp(u_world_sun_dir.y * 4.0, 0.0, 1.0)
uniform.float.u_airfog_day_weight = airfog_day_t * airfog_day_t * (3.0 - 2.0 * airfog_day_t)
variable.float.airfog_twilight_t = clamp((u_world_sun_dir.y + 0.25) * 4.0, 0.0, 1.0)
uniform.float.u_airfog_twilight_weight = airfog_twilight_t * airfog_twilight_t * (3.0 - 2.0 * airfog_twilight_t)

# -- Shadow projection diagonals / pixel footprint / AO rect / star / cirrus --
variable.float.shadow_proj_x = shadowProjection.0.0
variable.float.shadow_proj_y = shadowProjection.1.1
variable.float.shadow_proj_z = shadowProjection.2.2
uniform.vec2.u_shadow_projection_xy = vec2(shadow_proj_x, shadow_proj_y)
uniform.float.u_shadow_projection_z = shadow_proj_z
uniform.float.u_pixel_world_scale = max(gbufferProjection.1.1 * u_render_res.y, 1.0)
uniform.float.u_pixel_world_scale_prev = abs(gbufferPreviousProjection.1.1) * u_render_res.y
variable.float.ao_half_w = max(floor(u_render_res.x * 0.5 + 0.5), 1.0)
variable.float.ao_half_h = max(floor(u_render_res.y * 0.5 + 0.5), 1.0)
uniform.vec2.u_ao_half_res = vec2(ao_half_w, ao_half_h)
uniform.float.u_star_cos_theta = u_world_sun_dir.y * cos(radians(-15.0)) - u_world_sun_dir.z * sin(radians(-15.0))
uniform.float.u_star_sin_theta = 0.0 - u_world_sun_dir.x
uniform.float.u_cirrus_height_diff = 6367.0 - abs(6360.0 + u_cam_altitude)
