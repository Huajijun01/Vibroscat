# -- Blend: special overlays --

blend.gbuffers_armor_glint = SRC_COLOR ONE ZERO ONE
# Iris applies blend.<program> as the *global* blend function, but a per-buffer
# override enabled by an earlier program still wins for the draw-buffer slot it
# covers: the translucents declare colortex12, which is their draw-buffer 0, and
# glBlendFuncSeparatei(0, ...) stays enabled into later programs. gbuffers_weather
# writes colortex11 at its own draw-buffer 0, so the global SRC_ALPHA premultiply
# was being overridden by the leftover ONE ONE_MINUS_SRC_ALPHA, and air fog's
# premultiplied sheet contract silently broke. Pin the sheet's own buffer too.
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex11 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_damagedblock = ONE ZERO ZERO ONE

# The RSM alpha channel contains normal data, never an opacity blend factor.
blend.shadow = off
blend.shadow_solid = off
blend.shadow_cutout = off
blend.shadow_water = off
blend.shadow_entities = off
blend.shadow_block = off

# -- Colortex flips --
# The opaque main side holds shading normals. Cloud compute + accumulation
# borrow alt, then return to main before SSR/GI/shading. deferred4 clears alt
# and its normal output flip hands that empty side to translucent rendering.
# The two manual flips are paired only while cloud-enabled deferred1 exists.
#ifdef VOLUMETRIC_CLOUDS
flip.deferred_pre.colortex12 = true
flip.deferred1.colortex12 = true
#endif

#if AO_MODE != 0 && GI_MODE == 0
# AO borrows colortex2 alt before material scalars are needed by SSR/GI/shading.
# Pair these only while the AO compute and deferred1 fragment are scheduled.
flip.deferred_pre.colortex2 = true
flip.deferred1.colortex2 = true
#endif

# composite_pre flips run before the first composite program with no pass of
# their own; composite1 hands colortex5 back so composite2 and later see the
# pre-deferred4 side again.
flip.deferred4.colortex5 = false
flip.composite_pre.colortex5 = true
flip.composite1.colortex5 = true

